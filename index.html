<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Deep Drop Pro Tournament — championship-grade fishing. Sharper fish, faster water, bigger payouts. Can you land the Golden Koi?">
<title>Deep Drop Pro — Tournament Edition</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #061523;
    --text: #eaf6ff;
    --muted: #8fb2d0;
    --gold: #ffd166;
    --aqua: #4fe3d0;
    --coral: #ff6b7f;
    --panel: rgba(6, 21, 35, .82);
    --stroke: rgba(255, 255, 255, .16);
  }

  html, body { height: 100%; }

  body {
    display: grid;
    place-items: center;
    padding: 18px;
    overflow: hidden;
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #1d4f6e 0%, #0a2137 45%, #050d19 100%);
    -webkit-tap-highlight-color: transparent;
  }

  .frame {
    position: relative;
    width: min(96vw, 940px);
    aspect-ratio: 16 / 10;
    max-height: 92vh;
    border-radius: 26px;
    overflow: hidden;
    border: 1px solid var(--stroke);
    box-shadow: 0 40px 110px rgba(0, 0, 0, .6), inset 0 1px rgba(255, 255, 255, .18);
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .hud-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

  .pill-row { display: flex; gap: 9px; }

  .pill {
    min-width: 86px;
    padding: 9px 14px;
    border-radius: 15px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(10px);
  }

  .pill label {
    display: block;
    font-size: .62rem;
    font-weight: 900;
    letter-spacing: .13em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .pill data {
    display: block;
    margin-top: 1px;
    font-size: 1.5rem;
    font-weight: 900;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }

  .pill data.warn { color: var(--gold); }
  .pill data.crit { color: var(--coral); }

  .streak {
    align-self: center;
    padding: 7px 13px;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 900;
    letter-spacing: .02em;
    color: var(--ink);
    background: linear-gradient(135deg, var(--gold), #ffe9a8);
    box-shadow: 0 6px 20px rgba(255, 209, 102, .35);
    opacity: 0;
    transform: translateY(-6px) scale(.9);
    transition: opacity .2s, transform .2s;
  }
  .streak.on { opacity: 1; transform: none; }

  .icon-btn {
    pointer-events: auto;
    width: 40px;
    height: 40px;
    border: 1px solid var(--stroke);
    border-radius: 13px;
    background: var(--panel);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: transform .12s, background .12s;
  }
  .icon-btn:hover { transform: translateY(-1px); background: rgba(15, 40, 62, .9); }

  .hud-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }

  .depth {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 8px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(10px);
  }
  .depth-track { position: relative; width: 132px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
  .depth-fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--aqua), #7bb6ff); transition: width .08s linear; }
  .depth-label { font-size: .78rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .catch-toast {
    padding: 9px 16px;
    border-radius: 999px;
    font-size: .85rem;
    font-weight: 900;
    background: var(--panel);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(10px);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .25s, transform .25s;
  }
  .catch-toast.on { opacity: 1; transform: none; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(ellipse at 50% 40%, rgba(4, 14, 26, .72), rgba(3, 9, 18, .93));
    backdrop-filter: blur(6px);
  }

  .card {
    width: min(100%, 480px);
    padding: 30px 30px 26px;
    text-align: center;
    border-radius: 24px;
    background: rgba(7, 20, 34, .9);
    border: 1px solid var(--stroke);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
  }

  .card .art { font-size: 2.9rem; line-height: 1; margin-bottom: 10px; }

  .card h1, .card h2 {
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    font-weight: 900;
    letter-spacing: -.045em;
    line-height: 1.05;
  }

  .card .sub { margin-top: 9px; color: var(--muted); font-size: .95rem; line-height: 1.55; }

  .keys {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 20px 0 22px;
  }
  .key {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border-radius: 11px;
    font-size: .8rem;
    font-weight: 700;
    color: #cfe4f8;
    background: rgba(255, 255, 255, .07);
    border: 1px solid var(--stroke);
  }
  .key b {
    padding: 2px 7px;
    border-radius: 6px;
    font-size: .74rem;
    color: var(--ink);
    background: #cfe4f8;
  }

  .btn {
    border: 0;
    border-radius: 999px;
    padding: 15px 34px;
    font: inherit;
    font-size: 1.03rem;
    font-weight: 950;
    color: #04202a;
    cursor: pointer;
    background: linear-gradient(135deg, var(--aqua), #9ef7ea);
    box-shadow: 0 7px 0 #1c8577;
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 9px 0 #1c8577; }
  .btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #1c8577; }

  .scoreline {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin: 18px 0 6px;
  }
  .scoreline div { text-align: center; }
  .scoreline label { display: block; font-size: .64rem; font-weight: 900; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .scoreline span { font-size: 1.85rem; font-weight: 900; font-variant-numeric: tabular-nums; }

  .best-catch {
    margin: 14px 0 20px;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: .88rem;
    font-weight: 700;
    color: #d8ecff;
    background: rgba(255, 255, 255, .06);
    border: 1px solid var(--stroke);
  }
  .best-catch em { font-style: normal; color: var(--gold); font-weight: 900; }

  .hidden { display: none !important; }

  @media (max-width: 620px) {
    body { padding: 8px; }
    .frame { aspect-ratio: 3 / 4.4; border-radius: 20px; }
    .hud { padding: 11px 12px; }
    .pill { min-width: 64px; padding: 7px 10px; border-radius: 12px; }
    .pill data { font-size: 1.18rem; }
    .depth-track { width: 84px; }
    .catch-toast { font-size: .76rem; padding: 7px 12px; }
    .card { padding: 24px 20px 22px; }
  }
</style>
</head>
<body>
<main class="frame">
  <canvas id="stage"></canvas>

  <div class="hud">
    <div class="hud-top">
      <div class="pill-row">
        <div class="pill"><label>Score</label><data id="hud-score">0</data></div>
        <div class="pill"><label>Time</label><data id="hud-time">60</data></div>
        <div class="pill"><label>Best</label><data id="hud-best">0</data></div>
      </div>
      <div class="streak" id="hud-streak">Streak ×1</div>
      <button class="icon-btn" id="btn-sound" title="Toggle sound" aria-label="Toggle sound">🔊</button>
    </div>

    <div class="hud-bottom">
      <div class="depth">
        <span class="depth-label">DEPTH</span>
        <div class="depth-track"><div class="depth-fill" id="depth-fill"></div></div>
        <span class="depth-label" id="depth-label">0 m</span>
      </div>
      <div class="catch-toast" id="catch-toast"></div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card" id="card">
      <div class="art">🎣</div>
      <h1>Deep Drop <span style="font-size:.5em;vertical-align:.35em;letter-spacing:.06em;color:var(--gold)">PRO</span></h1>
      <p class="sub">Tournament water. The fish here have seen every hook in the harbour, so they run sharper and faster than the ones back home. Land the Golden Koi and the leaderboard is yours.</p>
      <div class="keys">
        <span class="key"><b>← →</b> steer boat</span>
        <span class="key"><b>Space</b> drop hook</span>
        <span class="key">or just <b>click</b> / drag</span>
      </div>
      <button class="btn" id="btn-start">Cast off</button>
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  const el = {
    score: document.getElementById("hud-score"),
    time: document.getElementById("hud-time"),
    best: document.getElementById("hud-best"),
    streak: document.getElementById("hud-streak"),
    depthFill: document.getElementById("depth-fill"),
    depthLabel: document.getElementById("depth-label"),
    toast: document.getElementById("catch-toast"),
    overlay: document.getElementById("overlay"),
    card: document.getElementById("card"),
    sound: document.getElementById("btn-sound")
  };

  const ROUND_SECONDS = 60;
  // Namespaced away from the standard edition: both are served from the same
  // github.io origin, so a shared key would clobber the real game's high score.
  const BEST_KEY = "deepDropProBest";

  // Depth bands are fractions of the underwater column: shallow fish are easy
  // and cheap, deep fish are the reason you take the long drop.
  const SPECIES = [
    { name: "Sardine",     points: 5,   emoji: "🐟", weight: 26, band: [0.02, 0.26], len: 30, speed: 78,  body: "#9fdcff", belly: "#e8f7ff", fin: "#5fb6e8" },
    { name: "Mackerel",    points: 10,  emoji: "🐟", weight: 21, band: [0.14, 0.42], len: 40, speed: 92,  body: "#7fe0c0", belly: "#e3fff6", fin: "#39b394" },
    { name: "Clownfish",   points: 18,  emoji: "🐠", weight: 16, band: [0.22, 0.52], len: 34, speed: 68,  body: "#ff9b45", belly: "#ffe3c4", fin: "#e8702a", stripes: true },
    { name: "Pufferfish",  points: 26,  emoji: "🐡", weight: 11, band: [0.34, 0.64], len: 38, speed: 44,  body: "#ffd166", belly: "#fff2c9", fin: "#d9a327", puff: true },
    { name: "Bluefin",     points: 40,  emoji: "🐟", weight: 10, band: [0.46, 0.78], len: 62, speed: 118, body: "#5aa9ff", belly: "#d6ecff", fin: "#2a6fc4", skittish: true },
    { name: "Anglerfish",  points: 70,  emoji: "🎏", weight: 6,  band: [0.66, 0.95], len: 52, speed: 54,  body: "#7a5cff", belly: "#c9bcff", fin: "#4a33b8", lure: true },
    { name: "Golden Koi",  points: 150, emoji: "✨", weight: 2,  band: [0.58, 0.94], len: 46, speed: 150, body: "#ffcf3d", belly: "#fff4c2", fin: "#e0a413", skittish: true, glow: true },
    { name: "Old Boot",    points: -12, emoji: "🥾", weight: 7,  band: [0.70, 0.97], len: 34, speed: 16,  junk: true },
    { name: "Tin Can",     points: -6,  emoji: "🥫", weight: 6,  band: [0.55, 0.92], len: 26, speed: 12,  junk: true }
  ];

  const TOTAL_WEIGHT = SPECIES.reduce((sum, s) => sum + s.weight, 0);

  let W = 0, H = 0, waterY = 0, seabedY = 0;

  const game = {
    phase: "idle",          // idle | playing | over
    score: 0,
    timeLeft: ROUND_SECONDS,
    streak: 0,
    bestCatch: null,
    nearMisses: 0,
    casts: 0,
    fish: [],
    bubbles: [],
    pops: [],
    rays: [],
    weeds: [],
    boat: { x: 0, vx: 0, aim: null },
    hook: { x: 0, y: 0, mode: "idle", caught: null },
    keys: new Set(),
    t: 0
  };

  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  el.best.textContent = best;

  /* ---------------- sizing ---------------- */

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    waterY = Math.round(H * 0.24);
    seabedY = H - Math.max(26, H * 0.05);
    if (game.phase === "idle") game.boat.x = W / 2;
    buildScenery();
  }

  function buildScenery() {
    game.rays = Array.from({ length: 7 }, (_, i) => ({
      x: (i + 0.5) * (W / 7) + rand(-30, 30),
      w: rand(26, 70),
      skew: rand(-0.22, 0.22),
      alpha: rand(0.035, 0.085)
    }));
    game.weeds = Array.from({ length: Math.max(6, Math.round(W / 90)) }, () => ({
      x: rand(0, W),
      h: rand(26, 74),
      blades: Math.round(rand(3, 6)),
      phase: rand(0, Math.PI * 2)
    }));
  }

  /* ---------------- helpers ---------------- */

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function depthToY(fraction) {
    return waterY + (seabedY - waterY) * fraction;
  }

  function pickSpecies() {
    let roll = Math.random() * TOTAL_WEIGHT;
    for (const s of SPECIES) {
      roll -= s.weight;
      if (roll <= 0) return s;
    }
    return SPECIES[0];
  }

  function spawnFish(offscreen = true) {
    const spec = pickSpecies();
    const dir = Math.random() < 0.5 ? 1 : -1;
    const y = depthToY(rand(spec.band[0], spec.band[1]));
    const margin = spec.len + 30;
    return {
      spec,
      dir,
      x: offscreen ? (dir === 1 ? -margin : W + margin) : rand(margin, W - margin),
      y,
      baseY: y,
      len: spec.len * rand(0.85, 1.15),
      speed: spec.speed * rand(0.82, 1.2),
      bob: rand(0, Math.PI * 2),
      bobAmp: rand(3, 11),
      wiggle: rand(0, Math.PI * 2),
      spooked: 0,
      vy: 0,
      caught: false
    };
  }

  function targetFishCount() {
    return clamp(Math.round(W / 78), 8, 15);
  }

  function stockPond() {
    game.fish = Array.from({ length: targetFishCount() }, () => spawnFish(false));
  }

  /* ---------------- audio ---------------- */

  let audioCtx = null;
  let soundOn = localStorage.getItem("deepDropSound") !== "off";
  el.sound.textContent = soundOn ? "🔊" : "🔇";

  function blip(freq, dur = 0.12, type = "sine", gain = 0.05) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.6, audioCtx.currentTime + dur);
      amp.gain.setValueAtTime(gain, audioCtx.currentTime);
      amp.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(amp).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (_) { /* audio is a nice-to-have */ }
  }

  el.sound.addEventListener("click", () => {
    soundOn = !soundOn;
    localStorage.setItem("deepDropSound", soundOn ? "on" : "off");
    el.sound.textContent = soundOn ? "🔊" : "🔇";
    if (soundOn) blip(660, 0.09, "triangle");
  });

  /* ---------------- rod geometry ---------------- */

  const rodTip = () => ({ x: game.boat.x + 52, y: waterY - 54 });
  const hookRest = () => waterY - 16;

  /* ---------------- input ---------------- */

  function dropHook() {
    if (game.phase !== "playing" || game.hook.mode !== "idle") return;
    game.hook.mode = "down";
    game.hook.x = rodTip().x;
    game.casts++;
    blip(320, 0.1, "triangle", 0.04);
  }

  window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      if (game.phase === "playing") dropHook();
      else startRound();
      return;
    }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "a" || e.key === "d") {
      game.keys.add(e.key.toLowerCase());
      game.boat.aim = null;
    }
  });

  window.addEventListener("keyup", e => game.keys.delete(e.key.toLowerCase()));

  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    return clamp(cx - rect.left, 0, W);
  }

  canvas.addEventListener("pointerdown", e => {
    if (game.phase !== "playing") return;
    game.boat.aim = pointerX(e);
    dropHook();
  });

  canvas.addEventListener("pointermove", e => {
    if (game.phase !== "playing") return;
    game.boat.aim = pointerX(e);
  });

  window.addEventListener("resize", resize);

  /* ---------------- round flow ---------------- */

  function startRound() {
    game.phase = "playing";
    game.score = 0;
    game.timeLeft = ROUND_SECONDS;
    game.streak = 0;
    game.bestCatch = null;
    game.nearMisses = 0;
    game.casts = 0;
    game.pops = [];
    game.bubbles = [];
    game.hook = { x: game.boat.x, y: hookRest(), mode: "idle", caught: null };
    stockPond();
    el.overlay.classList.add("hidden");
    updateHud();
    setStreakBadge();
    blip(520, 0.14, "triangle");
  }

  function endRound() {
    game.phase = "over";
    game.hook.mode = "idle";
    game.hook.caught = null;
    const isBest = game.score > best;
    if (isBest) {
      best = game.score;
      localStorage.setItem(BEST_KEY, String(best));
      el.best.textContent = best;
    }
    const bc = game.bestCatch;
    el.card.innerHTML = `
      <div class="art">🐟</div>
      <h2>Fish landed: 0</h2>
      <div class="scoreline">
        <div><label>Casts</label><span>${game.casts}</span></div>
        <div><label>Near misses</label><span>${game.nearMisses}</span></div>
        <div><label>Score</label><span>${game.score}</span></div>
      </div>
      <p class="best-catch">
        ${bc
          ? `Your finest trophy this round: ${bc.emoji} <em>${bc.name}</em>.`
          : `Not one fish. Not even close.`}
        <br><em>The ocean remains undefeated.</em>
      </p>
      <button class="btn" id="btn-again">Try again</button>
    `;
    el.overlay.classList.remove("hidden");
    document.getElementById("btn-again").addEventListener("click", startRound);
    blip(isBest ? 880 : 240, 0.3, isBest ? "triangle" : "sine", 0.05);
  }

  /* ---------------- hud ---------------- */

  function updateHud() {
    el.score.textContent = game.score;
    const secs = Math.max(0, Math.ceil(game.timeLeft));
    el.time.textContent = secs;
    el.time.className = secs <= 8 ? "crit" : secs <= 18 ? "warn" : "";
    const frac = clamp((game.hook.y - waterY) / (seabedY - waterY), 0, 1);
    el.depthFill.style.width = (frac * 100) + "%";
    el.depthLabel.textContent = Math.round(frac * 40) + " m";
  }

  function setStreakBadge() {
    const mult = streakMultiplier();
    if (mult > 1) {
      el.streak.textContent = `Streak ×${mult}`;
      el.streak.classList.add("on");
    } else {
      el.streak.classList.remove("on");
    }
  }

  const streakMultiplier = () => game.streak >= 6 ? 3 : game.streak >= 3 ? 2 : 1;

  let toastTimer = null;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("on"), 1500);
  }

  /* ---------------- catching ---------------- */

  function landCatch(fish) {
    const spec = fish.spec;
    const mult = spec.junk ? 1 : streakMultiplier();
    const gained = spec.points * mult;
    game.score = Math.max(0, game.score + gained);

    if (spec.junk) {
      game.streak = 0;
      game.timeLeft = Math.max(0, game.timeLeft - 2);
      if (!game.bestCatch) {
        game.bestCatch = { name: spec.name, emoji: spec.emoji, points: spec.points };
      }
      toast(`${spec.emoji} ${spec.name} — ${gained} pts, −2s`);
      blip(150, 0.22, "square", 0.045);
    } else {
      game.streak++;
      if (!game.bestCatch || spec.points > game.bestCatch.points) {
        game.bestCatch = { name: spec.name, emoji: spec.emoji, points: spec.points };
      }
      toast(`${spec.emoji} ${spec.name} +${gained}${mult > 1 ? ` (×${mult})` : ""}`);
      blip(spec.points >= 70 ? 1040 : 700, 0.16, "triangle", 0.05);
    }

    game.pops.push({
      x: rodTip().x,
      y: waterY - 30,
      text: (gained >= 0 ? "+" : "") + gained,
      color: spec.junk ? "#ff8296" : spec.glow ? "#ffd166" : "#7bffd9",
      life: 1
    });
    setStreakBadge();
  }

  function missedCast() {
    if (game.streak !== 0) {
      game.streak = 0;
      setStreakBadge();
    }
  }

  const TAUNTS = ["nope", "not today", "too slow", "so close", "swim on by", "denied", "nice try", "almost"];
  let tauntCooldown = 0;

  function taunt(f) {
    game.nearMisses++;
    if (tauntCooldown > 0) return;
    tauntCooldown = 0.85;
    game.pops.push({
      x: f.x,
      y: f.y - f.len * 0.55,
      text: TAUNTS[Math.floor(Math.random() * TAUNTS.length)],
      color: "rgba(226, 242, 255, .8)",
      life: 1,
      small: true
    });
  }

  /* ---------------- update ---------------- */

  function update(dt) {
    game.t += dt;
    if (tauntCooldown > 0) tauntCooldown -= dt;

    if (game.phase === "playing") {
      game.timeLeft -= dt;
      if (game.timeLeft <= 0) {
        game.timeLeft = 0;
        updateHud();
        endRound();
        return;
      }
    }

    // Boat steering: keys take priority, otherwise glide toward pointer.
    const boat = game.boat;
    let dir = 0;
    if (game.keys.has("arrowleft") || game.keys.has("a")) dir -= 1;
    if (game.keys.has("arrowright") || game.keys.has("d")) dir += 1;

    if (game.phase === "playing") {
      if (dir !== 0) {
        boat.vx += dir * 1400 * dt;
      } else if (boat.aim !== null) {
        boat.vx += clamp((boat.aim - boat.x) * 7, -520, 520) * dt * 3.2;
      }
    }
    boat.vx *= Math.pow(0.0016, dt);
    boat.vx = clamp(boat.vx, -420, 420);
    boat.x = clamp(boat.x + boat.vx * dt, 46, W - 46);

    // Hook line
    const hook = game.hook;
    const maxDepth = seabedY - 8;
    if (hook.mode === "idle") {
      hook.x = rodTip().x;
      hook.y = hookRest();
    } else if (hook.mode === "down") {
      hook.y += 330 * dt;
      if (hook.y >= maxDepth) {
        hook.y = maxDepth;
        hook.mode = "up";
        missedCast();
      }
    } else if (hook.mode === "up") {
      const drag = hook.caught ? 1 + hook.caught.len / 90 : 1;
      hook.y -= (430 / drag) * dt;
      if (hook.caught) {
        hook.caught.x = hook.x;
        hook.caught.y = hook.y + 12;
      }
      if (hook.y <= hookRest()) {
        if (hook.caught) {
          landCatch(hook.caught);
          game.fish = game.fish.filter(f => f !== hook.caught);
          game.fish.push(spawnFish(true));
          hook.caught = null;
        }
        hook.mode = "idle";
      }
    }

    // Fish
    const hookLive = hook.mode === "down";
    for (const f of game.fish) {
      if (f.caught) continue;

      f.wiggle += dt * (6 + f.speed / 22);
      f.bob += dt * 1.6;
      f.y = f.baseY + Math.sin(f.bob) * f.bobAmp;

      let speed = f.speed;

      // Tournament fish have seen every hook in this harbour. They read the
      // line well before it reaches them and peel out of its path. Debris
      // resting on the seabed, of course, does no such thing.
      if (!f.spec.junk && hook.mode !== "idle") {
        const dx = f.x - hook.x;
        const dy = f.y - hook.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < 205) {
          f.spooked = 0.85;
          if ((hook.x - f.x) * f.dir > 0) f.dir = dx >= 0 ? 1 : -1;
          f.vy += (dy / dist) * 300 * dt;
          if (dist < 92) {
            f.vy += (dy >= 0 ? 1 : -1) * 210 * dt;
            taunt(f, dist);
          }
        }
      }

      if (f.spooked > 0) {
        f.spooked -= dt;
        speed *= 2.35;
      }

      f.vy *= Math.pow(0.05, dt);
      f.baseY = clamp(f.baseY + f.vy * dt, waterY + 26, seabedY - 16);
      f.y = f.baseY + Math.sin(f.bob) * f.bobAmp;

      f.x += f.dir * speed * dt;

      const edge = f.len + 40;
      if (f.x < -edge || f.x > W + edge) {
        Object.assign(f, spawnFish(true));
      }

      if (hookLive && !hook.caught && f.spec.junk) {
        const rx = f.len * 0.55;
        const ry = f.len * 0.3 + 6;
        if (Math.abs(hook.x - f.x) < rx && Math.abs(hook.y - f.y) < ry) {
          hook.caught = f;
          f.caught = true;
          hook.mode = "up";
          blip(190, 0.09, "triangle", 0.045);
        }
      }
    }

    while (game.fish.length < targetFishCount()) game.fish.push(spawnFish(true));

    // Bubbles
    if (Math.random() < dt * 9) {
      game.bubbles.push({ x: rand(0, W), y: seabedY + rand(-14, 0), r: rand(1.3, 4), vy: rand(16, 42), sway: rand(0, Math.PI * 2) });
    }
    for (const b of game.bubbles) {
      b.y -= b.vy * dt;
      b.sway += dt * 2.4;
      b.x += Math.sin(b.sway) * 8 * dt;
    }
    game.bubbles = game.bubbles.filter(b => b.y > waterY - 6);

    // Score pops
    for (const p of game.pops) {
      p.y -= 46 * dt;
      p.life -= dt * 1.5;
    }
    game.pops = game.pops.filter(p => p.life > 0);

    updateHud();
  }

  /* ---------------- drawing ---------------- */

  function drawSky() {
    const sky = ctx.createLinearGradient(0, 0, 0, waterY);
    sky.addColorStop(0, "#123a5c");
    sky.addColorStop(0.55, "#2a6f92");
    sky.addColorStop(1, "#57a7b8");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, waterY);

    // sun + glow
    const sx = W * 0.82, sy = waterY * 0.34;
    const glow = ctx.createRadialGradient(sx, sy, 2, sx, sy, waterY * 0.9);
    glow.addColorStop(0, "rgba(255, 233, 168, .85)");
    glow.addColorStop(1, "rgba(255, 233, 168, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, waterY);
    ctx.fillStyle = "#ffeaa7";
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(12, waterY * 0.13), 0, Math.PI * 2);
    ctx.fill();

    // clouds drift slowly
    ctx.fillStyle = "rgba(255,255,255,.16)";
    for (let i = 0; i < 3; i++) {
      const cw = W * (0.18 + i * 0.05);
      const cx = ((game.t * (7 + i * 4) + i * W * 0.42) % (W + cw * 2)) - cw;
      const cy = waterY * (0.24 + i * 0.2);
      ctx.beginPath();
      ctx.ellipse(cx, cy, cw * 0.5, waterY * 0.06, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + cw * 0.22, cy - waterY * 0.03, cw * 0.3, waterY * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWater() {
    const sea = ctx.createLinearGradient(0, waterY, 0, H);
    sea.addColorStop(0, "#1d7fa6");
    sea.addColorStop(0.35, "#12557d");
    sea.addColorStop(0.72, "#0b2f52");
    sea.addColorStop(1, "#061a30");
    ctx.fillStyle = sea;
    ctx.fillRect(0, waterY, W, H - waterY);

    // light shafts
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, waterY, W, H - waterY);
    ctx.clip();
    for (const r of game.rays) {
      const sway = Math.sin(game.t * 0.5 + r.x) * 14;
      ctx.fillStyle = `rgba(190, 240, 255, ${r.alpha})`;
      ctx.beginPath();
      ctx.moveTo(r.x - r.w / 2 + sway, waterY);
      ctx.lineTo(r.x + r.w / 2 + sway, waterY);
      ctx.lineTo(r.x + r.w * 1.6 + r.skew * 260 + sway, seabedY);
      ctx.lineTo(r.x - r.w * 1.6 + r.skew * 260 + sway, seabedY);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSeabed() {
    ctx.fillStyle = "#0a2036";
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, seabedY + 6);
    for (let x = 0; x <= W; x += 42) {
      ctx.lineTo(x, seabedY + Math.sin(x * 0.045) * 5);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "rgba(80, 210, 170, .5)";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    for (const wd of game.weeds) {
      for (let b = 0; b < wd.blades; b++) {
        const bx = wd.x + b * 5 - wd.blades * 2.5;
        const h = wd.h * (0.6 + (b % 3) * 0.2);
        ctx.beginPath();
        ctx.moveTo(bx, seabedY);
        ctx.quadraticCurveTo(
          bx + Math.sin(game.t * 1.1 + wd.phase + b) * 12, seabedY - h * 0.6,
          bx + Math.sin(game.t * 1.1 + wd.phase + b) * 18, seabedY - h
        );
        ctx.stroke();
      }
    }
  }

  function drawSurface() {
    ctx.save();
    ctx.strokeStyle = "rgba(220, 250, 255, .55)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const y = waterY + Math.sin(x * 0.03 + game.t * 1.9) * 3 + Math.sin(x * 0.011 - game.t * 1.1) * 2;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawBoat() {
    const bob = Math.sin(game.t * 1.5) * 3;
    const tilt = clamp(game.boat.vx / 2600, -0.09, 0.09) + Math.sin(game.t * 1.5) * 0.016;
    ctx.save();
    ctx.translate(game.boat.x, waterY + bob);
    ctx.rotate(tilt);

    // hull
    ctx.fillStyle = "#e8592f";
    ctx.beginPath();
    ctx.moveTo(-58, -16);
    ctx.lineTo(58, -16);
    ctx.quadraticCurveTo(44, 16, 0, 17);
    ctx.quadraticCurveTo(-44, 16, -58, -16);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.22)";
    ctx.fillRect(-58, -16, 116, 5);
    ctx.fillStyle = "#fff3e2";
    ctx.fillRect(-52, -13, 104, 4);

    // cabin
    ctx.fillStyle = "#f7f3ea";
    ctx.beginPath();
    ctx.roundRect(-30, -40, 34, 25, 5);
    ctx.fill();
    ctx.fillStyle = "#2d80a8";
    ctx.beginPath();
    ctx.roundRect(-25, -35, 11, 10, 2.5);
    ctx.roundRect(-10, -35, 11, 10, 2.5);
    ctx.fill();

    // rod
    ctx.strokeStyle = "#f0d9a8";
    ctx.lineWidth = 3.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(12, -18);
    ctx.quadraticCurveTo(38, -34, 52, -54);
    ctx.stroke();

    // little flag
    ctx.strokeStyle = "#f7f3ea";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-38, -40);
    ctx.lineTo(-38, -62);
    ctx.stroke();
    ctx.fillStyle = "#4fe3d0";
    ctx.beginPath();
    ctx.moveTo(-38, -62);
    ctx.lineTo(-20, -56);
    ctx.lineTo(-38, -50);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawLine() {
    const tip = rodTip();
    const hook = game.hook;
    const bob = Math.sin(game.t * 1.5) * 3;
    ctx.strokeStyle = "rgba(233, 248, 255, .62)";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y + bob);
    const sag = hook.mode === "up" && hook.caught ? 16 : 6;
    ctx.quadraticCurveTo(hook.x + sag, (tip.y + hook.y) / 2, hook.x, hook.y);
    ctx.stroke();

    // hook itself
    ctx.strokeStyle = "#dfe9f2";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(hook.x, hook.y - 7);
    ctx.lineTo(hook.x, hook.y + 2);
    ctx.arc(hook.x - 3.5, hook.y + 2, 3.5, 0, Math.PI, false);
    ctx.stroke();
  }

  function drawFish(f) {
    const spec = f.spec;
    const L = f.len;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(f.dir, 1);
    ctx.rotate(Math.sin(f.wiggle) * 0.05);

    if (spec.junk) {
      ctx.globalAlpha = 0.95;
      ctx.font = `${L}px ui-rounded, "Apple Color Emoji", system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.scale(f.dir, 1); // keep emoji unmirrored
      ctx.fillText(spec.emoji, 0, 0);
      ctx.restore();
      return;
    }

    if (spec.glow) {
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, L * 1.5);
      g.addColorStop(0, "rgba(255, 214, 92, .38)");
      g.addColorStop(1, "rgba(255, 214, 92, 0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, L * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // tail
    const tw = Math.sin(f.wiggle) * 0.5;
    ctx.save();
    ctx.translate(-L * 0.48, 0);
    ctx.rotate(tw);
    ctx.fillStyle = spec.fin;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-L * 0.34, -L * 0.26);
    ctx.lineTo(-L * 0.22, 0);
    ctx.lineTo(-L * 0.34, L * 0.26);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // dorsal fin
    ctx.fillStyle = spec.fin;
    ctx.beginPath();
    ctx.moveTo(-L * 0.1, -L * (spec.puff ? 0.34 : 0.26));
    ctx.lineTo(L * 0.14, -L * 0.05);
    ctx.lineTo(-L * 0.3, -L * 0.06);
    ctx.closePath();
    ctx.fill();

    // body
    const ry = L * (spec.puff ? 0.42 : 0.29);
    const bodyGrad = ctx.createLinearGradient(0, -ry, 0, ry);
    bodyGrad.addColorStop(0, spec.body);
    bodyGrad.addColorStop(1, spec.belly);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, L * (spec.puff ? 0.44 : 0.5), ry, 0, 0, Math.PI * 2);
    ctx.fill();

    if (spec.stripes) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(0, 0, L * 0.5, ry, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = "rgba(255,255,255,.85)";
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(i * L * 0.22, 0, L * 0.055, ry, 0.12, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    if (spec.puff) {
      ctx.strokeStyle = spec.fin;
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 7; i++) {
        const a = -0.9 + i * 0.3;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * L * 0.4, Math.sin(a) * ry * 0.9);
        ctx.lineTo(Math.cos(a) * L * 0.55, Math.sin(a) * ry * 1.25);
        ctx.stroke();
      }
    }

    if (spec.lure) {
      ctx.strokeStyle = "#cbbcff";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(L * 0.3, -ry * 0.7);
      ctx.quadraticCurveTo(L * 0.62, -ry * 1.5, L * 0.5, -ry * 1.9);
      ctx.stroke();
      const pulse = 2.6 + Math.sin(game.t * 5 + f.bob) * 1.1;
      ctx.fillStyle = "#eaff8a";
      ctx.shadowColor = "#eaff8a";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(L * 0.5, -ry * 1.95, pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // eye
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(L * 0.3, -L * 0.06, L * 0.075, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#06202f";
    ctx.beginPath();
    ctx.arc(L * 0.32, -L * 0.06, L * 0.038, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBubbles() {
    ctx.strokeStyle = "rgba(210, 245, 255, .35)";
    ctx.lineWidth = 1;
    for (const b of game.bubbles) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawPops() {
    ctx.textAlign = "center";
    for (const p of game.pops) {
      ctx.globalAlpha = clamp(p.life, 0, 1) * (p.small ? 0.9 : 1);
      ctx.font = p.small
        ? "800 14px ui-rounded, system-ui, sans-serif"
        : "900 22px ui-rounded, system-ui, sans-serif";
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawVignette() {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.78);
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(0,0,0,.42)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawWater();
    drawSeabed();
    drawBubbles();
    for (const f of game.fish) drawFish(f);
    drawSurface();
    drawBoat();
    drawLine();
    drawPops();
    drawVignette();
  }

  /* ---------------- loop ---------------- */

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  document.getElementById("btn-start").addEventListener("click", startRound);

  resize();
  game.boat.x = W / 2;
  game.hook = { x: W / 2, y: hookRest(), mode: "idle", caught: null };
  stockPond();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
